    --azul-900:#16212c; --azul-800:#1c2630; --azul-700:#27384a; --azul-600:#3d5066;
    --cinza-50:#f7f8fa; --cinza-100:#f1f3f5; --cinza-200:#e6e9ec; --cinza-300:#cfd6dc; --cinza-600:#5d6b78;
    --amarelo-500:#f2a900; --amarelo-300:#ffd675; --amarelo-900:#5a3f00;
    --verde-500:#00b19d; --verde-700:#00806f; --verde-900:#0b5c51;
    --vermelho-600:#b3261e; --vermelho-100:#fdeceb;

  html,body{height:100%}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;
    background:linear-gradient(180deg,#eef1f4,#e1e6eb);

  body.modo-app{display:block;height:100vh;overflow:hidden;background:var(--cinza-100)}
  p{margin:0 0 12px}
  h1{margin:0;font-size:20px;letter-spacing:-.2px}
  h2{margin:0;font-size:16px}
  a{color:var(--azul-700)}
  :focus-visible{outline:2px solid var(--azul-700);outline-offset:2px}

  .tela{width:100%;padding:24px 16px;display:grid;place-items:center}
  .tela-app{padding:0;display:flex;flex-direction:column;height:100vh;place-items:stretch}
  .cartao{
    width:min(430px,100%);background:#fff;border:1px solid var(--cinza-300);
    border-top:4px solid var(--amarelo-500);border-radius:var(--raio);
    padding:26px;box-shadow:var(--sombra)
  }
  .cartao[aria-busy="true"]{opacity:.75}
  .marca{display:flex;align-items:center;gap:10px;margin-bottom:6px;color:var(--azul-700)}
  .marca h1{font-size:19px}
  .sub{color:var(--cinza-600);font-size:13.5px;margin:0 0 14px}
  .rodape{margin:16px 0 0;font-size:11.5px;color:var(--cinza-600);text-align:center;line-height:1.7}
  .rodape a{color:var(--azul-700)}
  .carregando{font-size:13.5px;color:var(--cinza-600);margin:0}
  .sem-js{padding:24px;background:#fff;border:1px solid var(--cinza-300);border-radius:var(--raio);max-width:420px}

  .rotulo{display:block;font-size:12.5px;font-weight:600;color:var(--cinza-600);margin:0 0 5px}
  .campo{
    width:100%;padding:10px 11px;border:1px solid var(--cinza-300);border-radius:var(--raio-sm);
    font:inherit;background:#fff;color:var(--azul-900);transition:var(--transicao)
  }
  .campo:hover{border-color:#b6c0c9}
  .campo:focus{border-color:var(--azul-700);box-shadow:var(--foco);outline:none}
  .campo-invalido{border-color:var(--vermelho-600);background:var(--vermelho-100)}
  .grupo{margin-bottom:12px}
  .campo-senha{position:relative}
  .campo-senha .campo{padding-right:44px}
  .btn-olho{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);

    background:none;border:0;border-radius:var(--raio-sm);color:var(--cinza-600);cursor:pointer

  .btn-olho:hover{background:var(--cinza-100);color:var(--azul-700)}

  .aceite input{margin:2px 0 0;width:16px;height:16px;flex:none}

    white-space:nowrap;text-decoration:none

  .btn:not(:disabled):active{transform:translateY(1px)}
  .btn-bloco{width:100%;margin-top:8px}
  .btn-primario{background:var(--azul-700);color:#fff}
  .btn-primario:not(:disabled):hover{background:var(--azul-900)}
  .btn-destaque{background:var(--amarelo-500);color:var(--azul-900)}

  .btn-pix{background:var(--verde-700);color:#fff}

  .btn-perigo{background:var(--vermelho-600);color:#fff}
  .btn-perigo:not(:disabled):hover{background:#8f1d17}
  .btn-fantasma{background:#fff;border-color:var(--cinza-300);color:var(--azul-700)}

  .btn-limpo{background:none;color:var(--cinza-600)}

    background:var(--cinza-100);border-radius:var(--raio-sm);color:var(--cinza-600);cursor:pointer;transition:var(--transicao)
  }

  .lista-acoes{list-style:none;margin:0;padding:0}

  .item-acao{
    display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:12px 4px;
    background:none;border:0;font:inherit;color:var(--azul-900);cursor:pointer;transition:var(--transicao)
  }
  .item-acao:hover{background:var(--cinza-50)}
  .item-acao svg{flex:none;margin-top:2px;color:var(--azul-600)}
  .item-acao b{display:block;font-size:13.5px;font-weight:600}
  .item-acao span{display:block;font-size:12px;color:var(--cinza-600)}
  .item-acao.perigo{color:var(--vermelho-600)}
  .item-acao.perigo svg{color:var(--vermelho-600)}

  .situacao{display:flex;gap:10px;align-items:flex-start;border-radius:var(--raio-sm);padding:11px 12px;margin-bottom:14px;font-size:13px}
  .situacao b{display:block;font-size:13.5px;margin-bottom:2px}
  .situacao p{margin:0}
  .situacao-aviso{background:#fff8e6;color:var(--amarelo-900);border:1px solid #f5e0a8}

  .preco{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
  .preco b{font-size:24px;letter-spacing:-.4px}
  .preco span{font-size:12px;color:var(--cinza-600)}

  .pix-rotulo{font-size:12px;color:var(--cinza-600);margin:0 0 2px;text-align:center}
  .pix-valor{font-size:28px;font-weight:700;letter-spacing:-.5px;margin:0 0 10px;text-align:center}
  .pix-qr{display:block;margin:0 auto 10px;border:1px solid var(--cinza-300);border-radius:var(--raio-sm);padding:6px;background:#fff}
  .pix-tempo{text-align:center;font-weight:600;color:var(--amarelo-900);font-size:13px;margin:0 0 12px}
  .linha-codigo{display:flex;gap:6px;margin-bottom:10px}
  .linha-codigo .campo{font-size:11.5px;padding:7px 8px;background:var(--cinza-100)}
  .linha-codigo .btn{flex:none}
  .aguardando{font-size:12.5px;color:var(--verde-900);background:#eaf7f4;border-radius:var(--raio-sm);padding:8px 10px;margin:0 0 4px;text-align:center}

  .barra{
    display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;
    background:var(--azul-800);color:#c3cdd8;font-size:12.5px;border-bottom:2px solid var(--amarelo-500)
  }
  .barra-marca{display:inline-flex;align-items:center;gap:8px;color:#fff;font-size:13px}
  .barra-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;border:1px solid transparent}
  .chip-ok{background:rgba(0,177,157,.18);border-color:rgba(0,177,157,.5);color:#8ff0e2}
  .chip-aviso{background:rgba(242,169,0,.16);border-color:rgba(242,169,0,.55);color:var(--amarelo-300)}
  .barra-espaco{flex:1 1 0}
  .quadro{flex:1 1 auto;min-height:0;background:#fff}
  .quadro iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>

const $ = function (id) { return document.getElementById(id); };
const esc = function (t) {
  return String(t === null || t === undefined ? "" : t).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

  if (!d) return "—";
  const t = new Date(d);

};
const plural = function (n, s) { return n + " " + s + (n === 1 ? "" : "s"); };

const ICONES = {

  ok: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',

  ajuda: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  suporte: '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
  lixeira: '<path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',

function ico(nome, tam) {
  const g = ICONES[nome] || ICONES.info;
  return '<svg width="' + (tam || 18) + '" height="' + (tam || 18) + '" viewBox="0 0 24 24" fill="none" ' +
    'stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">' + g + "</svg>";
}

const sb = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let acessoAtual = null;
let modoRecuperacao = /type=recovery/.test(location.hash) || /type=recovery/.test(location.search);
let intervaloTimerPix = null, intervaloConsultaPix = null, intervaloVersao = null;

function notificar(texto, tipo) {
  tipo = tipo || "info";
  const nota = $("nota");
  if (nota) { nota.className = "nota nota-" + tipo; nota.textContent = texto; }
  const container = $("avisos");
  if (!container) return;
  const el = document.createElement("div");
  el.className = "aviso";
  el.innerHTML = ico("info", 18) + "<span>" + esc(texto) + "</span>";
  container.appendChild(el);
  setTimeout(function () { el.remove(); }, 5600);
}
function limparNota() { const n = $("nota"); if (n) { n.className = "nota"; n.textContent = ""; } }

function textoErro(err) {
  const m = (err && (err.message || err.error_description || err.msg || err.error)) || "";
  const s = String(m).toLowerCase();
  if (/failed to fetch|networkerror/.test(s)) return "Sem conexão com o servidor. Verifique sua internet.";
  if (/invalid login credentials/.test(s)) return "E-mail ou senha incorretos.";
  if (/already registered/.test(s)) return "Este e-mail já está cadastrado.";
  return m || "Não foi possível concluir a operação.";
}

function travar(botao, texto) {
  if (!botao) return;
  if (!botao.dataset.rotulo) botao.dataset.rotulo = (botao.textContent || "").trim();
  botao.disabled = true;
  botao.textContent = texto || "Aguarde…";
}
function liberar(botao, rotulo) {
  if (!botao) return;
  botao.disabled = false;
  botao.textContent = rotulo || botao.dataset.rotulo || "Continuar";
}
function marcarInvalido(campo) {
  if (!campo) return;
  campo.classList.add("campo-invalido");
  if (campo.focus) campo.focus();
}

function abrirDialogo(opt) {
  const camada = $("camada");
  const fundo = document.createElement("div");
  fundo.className = "fundo-dialogo";
  const idTitulo = "dlg-" + Math.random().toString(36).slice(2, 8);
  fundo.innerHTML =
    '<div class="dialogo" role="dialog" aria-modal="true" aria-labelledby="' + idTitulo + '">' +
      '<div class="dialogo-topo"><h2 id="' + idTitulo + '">' + esc(opt.titulo) + "</h2>" +
        '<button type="button" class="btn-icone" data-fechar aria-label="Fechar">' + ico("x", 18) + "</button></div>" +
      '<div class="dialogo-corpo">' + (opt.conteudo || "") + "</div>" +
      '<div class="dialogo-acoes"></div>' +
    "</div>";
  const caixa = fundo.querySelector(".dialogo");
  const areaAcoes = fundo.querySelector(".dialogo-acoes");

  const fechar = function () {
    if (!fundo.isConnected) return;
    if (opt.aoFechar) opt.aoFechar();
    fundo.remove();
  };
  (opt.acoes || []).forEach(function (a) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn " + (a.variante || "btn-primario");
    b.innerHTML = (a.icone ? ico(a.icone, 17) : "") + esc(a.rotulo);
    b.onclick = function () { if (a.aoClicar) a.aoClicar({ fechar: fechar, botao: b, caixa: caixa }); };
    areaAcoes.appendChild(b);
  });
  if (!(opt.acoes || []).length) areaAcoes.remove();

  fundo.querySelectorAll("[data-fechar]").forEach(function (b) { b.onclick = fechar; });
  camada.appendChild(fundo);
  return { fechar: fechar, caixa: caixa };
}

function confirmar(opt) {
  return new Promise(function (resolve) {
    let resposta = false;
    abrirDialogo({
      titulo: opt.titulo,
      conteudo: '<p>' + (opt.texto || "") + "</p>",
      acoes: [
        { rotulo: "Cancelar", variante: "btn-fantasma", aoClicar: function (d) { d.fechar(); } },
        { rotulo: opt.rotuloOk || "Confirmar", variante: opt.perigoso ? "btn-perigo" : "btn-primario", aoClicar: function (d) { resposta = true; d.fechar(); } }
      ],
      aoFechar: function () { resolve(resposta); }
    });
  });
}

async function track(evento, dados) {
  if (!CFG.analitica) return;
  try {
    let uid = null;
    const s = await sb.auth.getSession();
    if (s && s.data && s.data.session) uid = s.data.session.user.id;
    await sb.from("eventos").insert({ evento: evento, dados: dados || {}, user_id: uid, portal_versao: CFG.versao, criado_em: new Date().toISOString() });
  } catch (e) {}
}

async function obterSessao() {
  try {
    const { data } = await sb.auth.getSession();
    return (data && data.session) || null;
  } catch (e) { return null; }
}
function marcarForaDoApp() {
  document.body.classList.remove("modo-app");
  const tela = $("tela");
  if (tela) tela.className = "tela";
}
function limparTimers() {
  [intervaloTimerPix, intervaloConsultaPix, intervaloVersao].forEach(function (i) { if (i) clearInterval(i); });
  intervaloTimerPix = null; intervaloConsultaPix = null; intervaloVersao = null;
}

function garantirCartao() {
  let cartao = $("cartao");
  if (cartao) return cartao;
  const tela = $("tela");
  tela.innerHTML = '<section class="cartao" id="cartao" aria-busy="true"></section>';
  return $("cartao");
}
function mostrarCartao(html) {
  marcarForaDoApp();
  const cartao = garantirCartao();
  cartao.setAttribute("aria-busy", "false");
  cartao.innerHTML = html;
}
function ligarOlhos() {
  document.querySelectorAll(".btn-olho").forEach(function (b) {
    b.onclick = function () {
      const campo = $(b.dataset.alvo);
      if (!campo) return;
      const mostrar = campo.type === "password";
      campo.type = mostrar ? "text" : "password";
      b.innerHTML = ico(mostrar ? "olhoFechado" : "olho", 20);
      campo.focus();
    };
  });
}
function rodapeLinks() {
  return '<p class="rodape">Portal v' + esc(CFG.versao) + ' · <a href="termos.html" target="_blank" rel="noopener">Termos de Uso</a> · <a href="privacidade.html" target="_blank" rel="noopener">Privacidade</a></p>';

  };

function abrirModalPix(dadosPix) {
  const codigo = dadosPix.qr_code;
  const base64 = dadosPix.qr_code_base64;
  const valor = Number(dadosPix.valor || 49.90);
  let segundosRestantes = Number(dadosPix.expiracao_segundos || CFG.expiracaoPixSegundos);

  const d = abrirDialogo({
    titulo: "Pagamento via PIX",
    conteudo:
      '<div class="pix-rotulo">Valor da assinatura</div>' +
      '<div class="pix-valor">' + brl(valor) + "</div>" +
      '<img class="pix-qr" src="data:image/png;base64,' + base64 + '" alt="QR Code PIX" width="180" height="180">' +
      '<div id="pix-tempo" class="pix-tempo">Expira em 05:00</div>' +
      '<div class="linha-codigo"><input class="campo" id="pix-copia" type="text" readonly value="' + esc(codigo) + '">' +
      '<button type="button" class="btn btn-primario btn-xs" id="btn-copiar">Copiar</button></div>' +
      '<div class="aguardando">Aguardando pagamento… liberação automática</div>',
    acoes: [{ rotulo: "Fechar", variante: "btn-fantasma", aoClicar: function (dlg) { dlg.fechar(); } }],
    aoFechar: function () { limparTimers(); }
  });

  const elTempo = d.caixa.querySelector("#pix-tempo");
  const btnCopia = d.caixa.querySelector("#btn-copiar");

  btnCopia.onclick = async function () {
    try {
      await navigator.clipboard.writeText(codigo);
      btnCopia.textContent = "Copiado!";
      setTimeout(function () { btnCopia.textContent = "Copiar"; }, 2000);
    } catch (e) { notificar("Selecione e copie manualmente.", "info"); }
  };

  limparTimers();
  intervaloTimerPix = setInterval(function () {
    segundosRestantes--;
    if (segundosRestantes <= 0) {
      clearInterval(intervaloTimerPix);
      if (elTempo) elTempo.textContent = "O código PIX expirou.";
      return;
    }
    const m = Math.floor(segundosRestantes / 60), s = segundosRestantes % 60;
    if (elTempo) elTempo.textContent = "Expira em " + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }, 1000);

  intervaloConsultaPix = setInterval(async function () {
    const sessao = await obterSessao();
    if (!sessao) return;
    const acc = await verificarAcessoServidor();
    if (acc && acc.ativo) {
      limparTimers();
      d.fechar();
      notificar("Pagamento confirmado! Acesso liberado.", "ok");
      carregarPortal();
    }
  }, 5000);
}

async function fluxoExcluirConta() {
  const ok = await confirmar({
    titulo: "Excluir conta permanentemente?",
    texto: "ATENÇÃO: esta operação apaga todos os seus dados deste portal de forma irreversível.",
    rotuloOk: "Sim, excluir minha conta",
    perigoso: true
  });
  if (!ok) return;

  try {
    const { data, error } = await sb.functions.invoke(CFG.funcoes.conta);
    if (error || (data && data.error)) throw (error || new Error(data.error));
    await sb.auth.signOut();
    mostrarCartao('<div class="marca">' + ico("ok", 22) + "<h1>Conta excluída</h1></div><p class=\"sub\">Sua conta foi excluída com sucesso.</p><button type=\"button\" class=\"btn btn-primario btn-bloco\" id=\"ok\">Voltar ao início</button>");
    $("ok").onclick = function () { telaLogin(); };
  } catch (err) { notificar(textoErro(err), "erro"); }
}

function abrirAjuda() {
  let html = '<ul class="lista-acoes">';
  CFG.ajuda.forEach(function (item) {
    html += '<li style="padding:10px 0;border-bottom:1px solid var(--cinza-200)">' +
      '<b style="font-size:13.5px;color:var(--azul-900);margin-bottom:2px">' + esc(item.q) + '</b>' +
      '<span style="font-size:13px;color:var(--cinza-600);display:block">' + esc(item.a) + "</span></li>";
  });
  html += "</ul>";
  abrirDialogo({
    titulo: "Ajuda e Dúvidas",
    conteudo: html,
    acoes: [{ rotulo: "Fechar", variante: "btn-fantasma", aoClicar: function (dlg) { dlg.fechar(); } }]
  });
}

function abrirSuporte() {
  let html = '<p>Escolha uma forma de contato com o suporte:</p><div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">';
  if (CFG.suporteWhatsapp) {
    html += '<a class="btn btn-pix" href="https://wa.me/' + CFG.suporteWhatsapp + '" target="_blank" rel="noopener">Falar pelo WhatsApp</a>';
  }
  if (CFG.suporteEmail) {
    html += '<a class="btn btn-fantasma" href="mailto:' + CFG.suporteEmail + '">Enviar e-mail para ' + esc(CFG.suporteEmail) + "</a>";
  }
  html += "</div>";
  abrirDialogo({
    titulo: "Suporte Técnico",
    conteudo: html,
    acoes: [{ rotulo: "Fechar", variante: "btn-fantasma", aoClicar: function (dlg) { dlg.fechar(); } }]
  });
}

/* Busca o preço atual no servidor (função "preco-assinatura", que lê o secret) */
async function obterPreco() {
  try {
    const { data, error } = await sb.functions.invoke(CFG.funcoesNovas.preco);
    if (!error && data && Number(data.preco) > 0) return Number(data.preco);
  } catch (e) {}
  return 49.90;
}

async function verificarAcessoServidor() {
  const preco = await obterPreco();

  try {
    const { data, error } = await sb.functions.invoke(CFG.funcoesNovas.acesso);
    if (!error && data) return { ativo: Boolean(data.ativo), preco: Number(data.preco || preco), valid_until: data.valid_until || null, motivo: data.motivo };
  } catch (e) {}

  try {
    const { data: ass, error } = await sb.from("assinaturas").select("status,valid_until,ativado_em").maybeSingle();
    if (error || !ass || !ass.valid_until) return { ativo: false, preco: preco, valid_until: null, motivo: "sem_assinatura" };
    const exp = new Date(ass.valid_until);
    const ativo = exp.getTime() > Date.now();
    return { ativo: ativo, preco: preco, valid_until: ass.valid_until, motivo: ativo ? "ativo" : "expirado" };
  } catch (err) { return { ativo: false, preco: preco, valid_until: null, motivo: "erro" }; }
}

async function carregarPortal() {
  limparTimers();

  const hash = location.hash || "", query = location.search || "";
  if (hash.includes("type=recovery") || query.includes("type=recovery") || modoRecuperacao) {
    modoRecuperacao = true;
    telaNovaSenha();
    return;
  }

  const sessao = await obterSessao();
  if (!sessao) { telaLogin(); return; }

  const acc = await verificarAcessoServidor();
  acessoAtual = acc;

  if (!acc.ativo) { telaAssinar(acc, acc.preco); return; }

  await montarAplicativo(acc);
}

async function montarAplicativo(acc) {
  document.body.classList.add("modo-app");
  const tela = $("tela");
  tela.className = "tela tela-app";
  tela.innerHTML = '<div class="carregando" style="padding:20px" role="status">Carregando calculadora…</div>';

  let htmlConteudo = "";
  try {
    const { data } = await sb.from("app_conteudo").select("html").eq("id", 1).maybeSingle();
    if (data) htmlConteudo = data.html || "";
  } catch (e) {}

  const exp = new Date(acc.valid_until);
  const dias = Math.max(0, Math.ceil((exp.getTime() - Date.now()) / 86400000));

  tela.innerHTML =
    '<header class="barra" role="banner">' +
      '<div class="barra-marca">' + ico("escudo", 18) + '<b>Orçamento de Caldeiraria</b></div>' +
      '<div class="barra-chip ' + (dias <= 5 ? "chip-aviso" : "chip-ok") + '"><span>Acesso até <b>' + fmtData(exp) + "</b> (" + plural(dias, "dia") + ")</span></div>" +
      '<div class="barra-espaco"></div>' +
      '<button type="button" class="btn btn-fantasma btn-xs" id="btn-menu-conta">' + ico("usuario", 15) + "Conta</button>" +
    "</header>" +
    '<section class="quadro" aria-label="Aplicativo principal">' +
      '<iframe id="iframe-app" sandbox="' + SANDBOX_CONTEUDO + '" title="Calculadora de Caldeiraria"></iframe>' +
    '</section>';

  const iframe = $("iframe-app");
  if (iframe) iframe.srcdoc = htmlConteudo;

  $("btn-menu-conta").onclick = function () { abrirMenuConta(); };
}

window.addEventListener("DOMContentLoaded", function () {
  if (!sb) {
    mostrarCartao('<div class="marca">' + ico("alerta", 22) + "<h1>Erro</h1></div><p class=\"sub\">Erro ao carregar o Supabase.</p>");
    return;
  }

  sb.auth.onAuthStateChange(function (evento) {
    if (evento === "PASSWORD_RECOVERY") {
      modoRecuperacao = true;
      telaNovaSenha();
    }
  });

  carregarPortal();
});
</script>
