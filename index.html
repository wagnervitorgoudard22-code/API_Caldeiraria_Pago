<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c2630">
<meta name="description" content="Portal de acesso à Calculadora de Caldeiraria: entre, assine e use a ferramenta.">
<title>Orçamento de Caldeiraria</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --azul-900:#16212c; --azul-800:#1c2630; --azul-700:#27384a; --azul-600:#3d5066;
    --cinza-50:#f7f8fa; --cinza-100:#f1f3f5; --cinza-200:#e6e9ec; --cinza-300:#cfd6dc; --cinza-600:#5d6b78;
    --amarelo-500:#f2a900; --amarelo-300:#ffd675; --amarelo-900:#5a3f00;
    --verde-500:#00b19d; --verde-700:#00806f; --verde-900:#0b5c51;
    --vermelho-600:#b3261e; --vermelho-100:#fdeceb;
    --fonte:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --raio:8px; --raio-sm:4px;
    --sombra:0 10px 30px -12px rgba(22,33,44,.35);
  }
  html,body{height:100%; width:100%; margin:0; padding:0; overflow:hidden;}
  body{
    display:grid;place-items:center;
    background:linear-gradient(180deg,#eef1f4,#e1e6eb);
    font:15px/1.5 var(--fonte);color:var(--azul-900);
  }
  body.modo-app{
    display:flex; flex-direction:column; width:100vw; height:100vh; overflow:hidden; background:var(--cinza-100);
  }
  p{margin:0 0 12px}
  h1{margin:0;font-size:20px}
  h2{margin:0;font-size:16px}
  a{color:var(--azul-700)}
  
  .tela{width:100%;padding:24px 16px;display:grid;place-items:center}
  .tela-app{padding:0;display:flex;flex-direction:column;width:100%;height:100%;flex:1;overflow:hidden;}
  
  .cartao{
    width:min(430px,100%);background:#fff;border:1px solid var(--cinza-300);
    border-top:4px solid var(--amarelo-500);border-radius:var(--raio);
    padding:26px;box-shadow:var(--sombra)
  }
  .marca{display:flex;align-items:center;gap:10px;margin-bottom:6px;color:var(--azul-700)}
  .sub{color:var(--cinza-600);font-size:13.5px;margin:0 0 14px}
  .rodape{margin:16px 0 0;font-size:11.5px;color:var(--cinza-600);text-align:center}
  .rotulo{display:block;font-size:12.5px;font-weight:600;color:var(--cinza-600);margin:0 0 5px}
  .campo{width:100%;padding:10px 11px;border:1px solid var(--cinza-300);border-radius:var(--raio-sm);font:inherit;background:#fff;color:var(--azul-900)}
  .grupo{margin-bottom:12px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 14px;border:1px solid transparent;border-radius:var(--raio-sm);
    font:600 14.5px/1.2 var(--fonte);cursor:pointer;width:100%;margin-top:8px;text-decoration:none
  }
  .btn-primario{background:var(--azul-700);color:#fff}
  .btn-destaque{background:var(--amarelo-500);color:var(--azul-900)}
  .btn-pix{background:var(--verde-700);color:#fff}
  .btn-fantasma{background:#fff;border-color:var(--cinza-300);color:var(--azul-700)}
  .btn-limpo{background:none;color:var(--cinza-600)}
  .nota{margin:0 0 12px;font-size:13px;border-radius:var(--raio-sm);padding:0}
  .nota:empty{display:none}
  .nota-erro{background:var(--vermelho-100);color:#7d1a15;border:1px solid #f2c6c2;padding:9px 11px}
  .fundo-dialogo{position:fixed;inset:0;background:rgba(15,22,29,.62);display:flex;align-items:center;justify-content:center;padding:16px;z-index:99}
  .dialogo{background:#fff;border-radius:var(--raio);width:min(460px,100%);padding:20px;box-shadow:var(--sombra);border-top:4px solid var(--amarelo-500)}
  .preco{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
  .preco b{font-size:24px}
  
  .barra{
    display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 16px;
    background:var(--azul-800);color:#fff;font-size:13px;border-bottom:2px solid var(--amarelo-500);
    width:100%;flex-shrink:0;
  }
  .quadro{flex:1 1 auto;width:100%;height:100%;background:#fff;overflow:hidden;}
  .quadro iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<main id="tela" class="tela">
  <section class="cartao" id="cartao"><p>Carregando o portal…</p></section>
</main>

<script>
const CFG = {
  supabaseUrl: "https://pjnbmvbcknmogznynnvz.supabase.co",
  supabaseAnonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqbmJtdmJja25tb2d6bnlubnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMzMwNjEsImV4cCI6MjEwNzkwOTA2MX0.Sqdc8NVSEuAGP4_oscJbDHQ9CR-hotnbM2d2N7g4ntw",
  versao: "1.5.5",
  funcoes: { pagamento: "criar-assinatura", conta: "deletar-conta" }
};

const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const brl = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

function mostrarCartao(html) {
  document.body.classList.remove("modo-app");
  $("cartao").innerHTML = html;
}

function telaLogin() {
  mostrarCartao(
    '<div class="marca"><h1>Orçamento de Caldeiraria</h1></div>' +
    '<p class="sub">Entre na sua conta para continuar.</p>' +
    '<div id="nota" class="nota"></div>' +
    '<form id="form-login">' +
      '<div class="grupo"><label class="rotulo">E-mail</label><input class="campo" id="email" type="email" required></div>' +
      '<div class="grupo"><label class="rotulo">Senha</label><input class="campo" id="senha" type="password" required></div>' +
      '<button type="submit" class="btn btn-primario">Entrar</button>' +
    '</form>'
  );

  $("form-login").onsubmit = async (e) => {
    e.preventDefault();
    try {
      const { error } = await sb.auth.signInWithPassword({ email: $("email").value, password: $("senha").value });
      if (error) throw error;
      carregarPortal();
    } catch (err) {
      $("nota").className = "nota nota-erro";
      $("nota").textContent = err.message || "Erro ao entrar.";
    }
  };
}

async function telaAssinar(precoSugerido) {
  let preco = precoSugerido || 49.90;

  const render = (p) => {
    mostrarCartao(
      '<div class="marca"><h1>Assinatura necessária</h1></div>' +
      '<p class="sub">Desbloqueie o acesso completo à Calculadora.</p>' +
      '<div class="preco"><span>Plano Profissional</span><b>' + brl(p) + '<span>/ mês</span></b></div>' +
      '<button type="button" class="btn btn-destaque" id="btn-cartao">Assinar com Cartão · ' + brl(p) + '/mês</button>' +
      '<button type="button" class="btn btn-pix" id="btn-pix">Pagar com PIX · ' + brl(p) + '</button>' +
      '<button type="button" class="btn btn-fantasma" id="btn-verificar">Verificar novamente</button>' +
      '<button type="button" class="btn btn-limpo" id="btn-sair">Sair da conta</button>'
    );

    $("btn-cartao").onclick = async () => {
      try {
        const { data, error } = await sb.functions.invoke(CFG.funcoes.pagamento, { body: { metodo: "cartao" } });
        if (error) throw error;
        if (data && data.url) {
          location.href = data.url;
        } else {
          alert("Link de pagamento não retornado.");
        }
      } catch (e) {
        alert("Erro ao redirecionar para o cartão.");
      }
    };

    $("btn-pix").onclick = async () => {
      try {
        const { data, error } = await sb.functions.invoke(CFG.funcoes.pagamento, { body: { metodo: "pix" } });
        if (error) throw error;
        abrirModalPix(data, p);
      } catch (e) {
        alert("Erro ao gerar PIX.");
      }
    };

    $("btn-verificar").onclick = () => carregarPortal();
    $("btn-sair").onclick = async () => { await sb.auth.signOut(); telaLogin(); };
  };

  render(preco);

  sb.functions.invoke(CFG.funcoes.pagamento, { body: { acao: "obter_preco" } })
    .then(({ data }) => {
      if (data && data.preco && Number(data.preco) !== preco) {
        preco = Number(data.preco);
        render(preco);
      }
    }).catch(() => {});
}

function abrirModalPix(dadosPix, precoAtual) {
  const d = document.createElement("div");
  d.className = "fundo-dialogo";
  const qrBase64 = dadosPix.qr_code_base64 || dadosPix.point_of_interaction?.transaction_data?.qr_code_base64 || "";
  const qrCode = dadosPix.qr_code || dadosPix.point_of_interaction?.transaction_data?.qr_code || "";

  d.innerHTML = '<div class="dialogo" style="text-align:center">' +
    '<h2>Pagamento via PIX</h2>' +
    '<p style="font-size:22px;font-weight:bold;margin:10px 0">' + brl(dadosPix.valor || precoAtual) + '</p>' +
    (qrBase64 ? '<img src="data:image/png;base64,' + qrBase64 + '" width="160" height="160" style="margin:10px 0">' : '<p>Escaneie o código copia e cola</p>') +
    '<input class="campo" type="text" readonly value="' + esc(qrCode) + '" style="font-size:11px;margin-bottom:10px">' +
    '<button class="btn btn-primario" id="fechar-pix">Fechar</button>' +
    '</div>';
  document.body.appendChild(d);
  d.querySelector("#fechar-pix").onclick = () => d.remove();
}

async function carregarPortal() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { telaLogin(); return; }

  const { data: ass } = await sb.from("assinaturas").select("valid_until").maybeSingle();
  if (!ass || !ass.valid_until || new Date(ass.valid_until).getTime() <= Date.now()) {
    telaAssinar();
    return;
  }

  let htmlConteudo = "<h1>Erro ao carregar conteúdo da calculadora</h1>";
  try {
    const { data } = await sb.from("app_conteudo").select("html").eq("id", 1).maybeSingle();
    if (data && data.html) htmlConteudo = data.html;
  } catch (e) {}

  document.body.classList.add("modo-app");
  const tela = $("tela");
  tela.className = "tela tela-app";
  tela.innerHTML = 
    '<header class="barra">' +
      '<b>Calculadora de Caldeiraria</b>' +
      '<div style="margin-left:auto; display:flex; gap:8px;">' +
        '<button class="btn btn-fantasma" style="width:auto;padding:5px 12px;margin:0;font-size:12px;" id="sair">Sair</button>' +
      '</div>' +
    '</header>' +
    '<section class="quadro">' +
      // ADICIONADO allow-downloads para permitir a geração e download de arquivos PDF
      '<iframe id="iframe-app" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin allow-downloads" title="Calculadora de Caldeiraria"></iframe>' +
    '</section>';

  $("iframe-app").srcdoc = htmlConteudo;
  $("sair").onclick = async () => { await sb.auth.signOut(); telaLogin(); };
}

window.addEventListener("DOMContentLoaded", () => carregarPortal());
</script>
</body>
</html>
